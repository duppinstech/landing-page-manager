name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint plugin PHP (excluding vendor)
        # Fails if any file fails php -l and prints only the failures. php -l exits
        # 255 on a parse error, which makes xargs stop early, so map it to 1.
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 sh -c 'php -l "$0" || exit 1' > lint.log 2>&1 \
            || { grep -v '^No syntax errors' lint.log; exit 1; }
